<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>转账</title>
  <link rel="stylesheet" href="payment-sidebar.css">
  <style>
    html, body {
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    #app {
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    .transfer-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f3f4f6;
    }
    .transfer-info-label {
      font-size: 14px;
      color: #666;
    }
    .transfer-info-value {
      font-size: 14px;
      font-weight: 500;
      color: #333;
    }
    .transfer-info-value.highlight {
      color: #667eea;
      font-weight: 600;
    }
    .user-id-display {
      margin-top: 8px;
      padding: 8px 12px;
      background: #f0f9ff;
      border-radius: 6px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Transfer Form -->
    <div id="transferForm" class="payment-container">
      <div class="payment-header">
        <h2>转账</h2>
        <button id="closeBtn" class="close-btn" title="取消">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="payment-info">
        <div class="transfer-info-row">
          <span class="transfer-info-label">收款方用户名</span>
          <span id="recipientUsername" class="transfer-info-value highlight">--</span>
        </div>
        <div id="userIdRow" class="transfer-info-row" style="display: none;">
          <span class="transfer-info-label">用户ID</span>
          <span id="recipientUserId" class="transfer-info-value">--</span>
        </div>
      </div>

      <div class="payment-form">
        <div class="form-group">
          <label for="transferAmount">转账金额 (LDC) *</label>
          <input
            type="number"
            id="transferAmount"
            class="input"
            placeholder="请输入转账金额"
            min="0.01"
            step="0.01"
            required>
        </div>

        <div class="form-group">
          <label for="transferRemark">备注 (可选)</label>
          <input
            type="text"
            id="transferRemark"
            class="input"
            placeholder="转账备注"
            maxlength="100">
        </div>

        <div id="transferPasswordSection" class="form-group">
          <label for="payKey">支付密码 (6位数字) *</label>
          <div class="password-input-group">
            <input
              type="password"
              id="payKey"
              class="input password-input"
              placeholder="请输入6位数字密码"
              maxlength="6"
              pattern="[0-9]{6}"
              autocomplete="off">
            <button id="togglePassword" class="toggle-btn" type="button">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div id="transferAuthSection" style="display: none;">
          <div class="user-id-display">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline-block; vertical-align: middle; margin-right: 6px;">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            </svg>
            <span style="color: #0369a1; font-weight: 500;">使用已保存的密码</span>
          </div>
        </div>

        <button id="transferButton" class="btn btn-pay">
          <span class="button-text">确认转账</span>
          <span id="loadingSpinner" class="spinner" style="display: none;"></span>
        </button>

        <button id="cancelButton" class="btn btn-cancel">取消</button>
      </div>
    </div>

    <!-- Success Screen -->
    <div id="successScreen" class="result-screen" style="display: none;">
      <div class="result-content">
        <div class="success-animation">
          <svg class="checkmark" viewBox="0 0 52 52">
            <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
            <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
          </svg>
        </div>

        <h2 class="result-title">转账成功!</h2>
        <div id="successMessage" class="result-message"></div>

        <button id="closeSuccessBtn" class="btn btn-primary">完成</button>
      </div>
    </div>

    <!-- Error Screen -->
    <div id="errorScreen" class="result-screen error" style="display: none;">
      <div class="result-content">
        <div class="error-animation">
          <svg class="error-mark" viewBox="0 0 52 52">
            <circle class="error-circle" cx="26" cy="26" r="25" fill="none"/>
            <path class="error-cross" fill="none" d="M16 16 36 36 M36 16 16 36"/>
          </svg>
        </div>

        <h2 class="result-title">转账失败</h2>
        <div id="errorMessage" class="result-message"></div>

        <button id="retryBtn" class="btn btn-primary">重试</button>
        <button id="closeErrorBtn" class="btn btn-secondary">关闭</button>
      </div>
    </div>
  </div>

  <script src="transfer.js"></script>
</body>
</html>
